function match(answers){
 if(answers.length!==BOOK.questions.length||!BOOK.questions.every((_,i)=>Number.isInteger(answers[i])&&answers[i]>=0&&answers[i]<4))throw Error('请先完成全部题目');
 const scores=BOOK.axes.map(()=>0), strongest=BOOK.axes.map(()=>0);
 answers.forEach((choice,i)=>{
  const axis=BOOK.questions[i][0],value=weights[choice];scores[axis]+=value;
  if(Math.abs(value)>Math.abs(strongest[axis]))strongest[axis]=value;
 });
 // 平分时，采用该维度最早出现的最强偏好。

}

 window.scrollTo(0,0);

function render(){

 $('progress').max=n;$('progress').value=answers.filter(Number.isInteger).length;
 $('question').textContent=q[1];$('options').replaceChildren();
 order.forEach((choice,i)=>{
  const btn=document.createElement('button');btn.className='option';btn.type='button';
  const letter=document.createElement('span');letter.textContent='ABCD'[i];letter.setAttribute('aria-hidden','true');
  btn.append(letter,document.createTextNode(q[choice+2]));btn.setAttribute('aria-pressed',String(answers[at]===choice));
  btn.onclick=()=>{answers[at]=choice;for(const item of $('options').children)item.setAttribute('aria-pressed',String(item===btn));$('next').disabled=false;$('progress').value=answers.filter(Number.isInteger).length};
  $('options').append(btn);
 });

};

   if(!content)continue;runs.push({type:'rule',y});y+=18;textBlock(label,28,42,serif,ink,true);textBlock(content,26,40,sans,ink);y+=19;
  }
  y+=4;textBlock('性情手册 · 趣味结果签',22,32,sans,accent);
  const card=surface(w,Math.ceil(y+30)),p=card.getContext('2d');
  p.fillStyle='#faf5e8';p.fillRect(0,0,w,card.height);p.fillStyle=color;p.fillRect(0,0,w,10);p.textBaseline='top';
  for(const r of runs){if(r.type==='art')p.drawImage(art,pad,r.y,inner,inner*art.height/art.width);
   else if(r.type==='rule'){p.fillStyle='#d2c8b7';p.fillRect(pad,r.y,inner,2)}
   else{p.fillStyle=r.col;p.font=r.font;p.fillText(r.line,pad,r.y)}}
  return card.toDataURL('image/png');
 }
 by('makeCard').onclick=()=>{
  if(!model||locked)return;
  try{const uri=poster();preview.src=uri;preview.alt=model.name+'完整结果卡';download.href=uri;download.download='性情手册-'+model.name+'.png';
   overlay.hidden=false;by('closeExport').focus({preventScroll:true});}
  catch{message.textContent='长图生成失败，请重试或截屏保存。'}
 };
 by('closeExport').onclick=closeExport;
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeExport()});
 document.addEventListener('keydown',e=>{
  if(overlay.hidden)return;
  if(e.key==='Escape'){e.preventDefault();closeExport()}
  if(e.key==='Tab'){const first=by('closeExport'),last=download;
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
   else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
 });
 by('restart').addEventListener('click',clear);
 return {show};
})();
