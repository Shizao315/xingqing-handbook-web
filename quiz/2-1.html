function paintLandscape(canvas) {
 const w=canvas.clientWidth,h=canvas.clientHeight;
 if(!w||!h)return;
 const d=Math.min(window.devicePixelRatio||1,2);
 canvas.width=w*d;canvas.height=h*d;
 const c=canvas.getContext('2d');c.scale(w*d/600,h*d/580);
 let seed=1907;
 function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
 function stroke(x,y,X,Y,color,width){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
 function shape(points,color){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=color;c.fill()}
 c.fillStyle='#bb6550';c.beginPath();c.arc(357,113,35,0,2*Math.PI);c.fill();
 function ridge(anchors,base,top,bottom,marks){
  const ridgeY=[];let j=0;
  for(let x=0;x<=600;x++){while(j<anchors.length-2&&x>anchors[j+1][0])j++;
   const [a,b]=anchors[j],[e,f]=anchors[j+1],t=(x-a)/(e-a);
   ridgeY[x]=b+(f-b)*t+Math.sin(x*.13)*2.4+Math.sin(x*.62)*1.4+rand()*2}
  const wash=c.createLinearGradient(0,Math.min(...ridgeY),0,base);wash.addColorStop(0,top);wash.addColorStop(1,bottom);
  shape([[0,base],...ridgeY.map((y,x)=>[x,y]),[600,base]],wash);
  for(let i=0;i<marks;i++){let x=Math.floor(rand()*600),y=ridgeY[x]+Math.pow(rand(),1.65)*(base-ridgeY[x]);
   if(y>base-4)continue;
   stroke(x,y,x-2-rand()*9,Math.min(base,y+rand()*12),'rgba(45,62,52,.105)',.5+rand()*1.2)}
 }
 ridge([[0,304],[51,275],[86,291],[150,245],[187,252],[240,203],[270,223],[325,181],[350,201],[393,164],[429,198],[479,175],[522,215],[600,179]],375,'#b0b7a8','rgba(225,225,207,0)',1450);
 ridge([[0,355],[65,341],[107,302],[152,310],[189,274],[219,259],[245,213],[262,230],[294,208],[322,250],[348,238],[388,263],[442,226],[473,237],[510,200],[544,177],[560,196],[600,165]],407,'#889789','rgba(203,208,187,.05)',2200);

 shape([[185,464],[216,464],[211,468],[192,468]],'#505c4d');stroke(202,463,202,442,'#646c5c',.8);shape([[201,443],[191,460],[201,459]],'#9e9c83');
 ridge([[0,571],[65,568],[133,578],[240,582],[338,557],[385,546],[421,519],[475,502],[520,471],[545,478],[600,442]],610,'#465b50','#9ba58b',2400);
 function pine(x,y,s){stroke(x,y,x+2*s,y-22*s,'#455247',1.7*s);for(let k=0;k<5;k++){let yy=y-(5+k*3.4)*s,wide=(8-k)*s;shape([[x-wide,yy+2*s],[x+s,yy-5*s],[x+wide*.85,yy+s],[x,yy]],'#45594d')}}
 for(let i=0;i<55;i++){let x=420+rand()*180;pine(x,524-(x-420)*.43+rand()*13,.35+rand()*.85)}
 for(let i=0;i<7000;i++){c.fillStyle=rand()>.45?'rgba(77,65,43,.045)':'rgba(255,254,233,.21)';c.fillRect(rand()*600,rand()*580,1+rand(),1)}
}

</script><script>const $=id=>document.getElementById(id);
const weights=[-2,-1,1,2];
const permutations=[[2,0,3,1],[1,3,0,2],[3,2,1,0],[0,1,2,3]];
function match(answers){
 if(answers.length!==BOOK.questions.length||!BOOK.questions.every((_,i)=>Number.isInteger(answers[i])&&answers[i]>=0&&answers[i]<4))throw Error('请先完成全部题目');
 const scores=BOOK.axes.map(()=>0), strongest=BOOK.axes.map(()=>0);
 answers.forEach((choice,i)=>{
  const axis=BOOK.questions[i][0],value=weights[choice];scores[axis]+=value;
  if(Math.abs(value)>Math.abs(strongest[axis]))strongest[axis]=value;
 });
 // 平分时，采用该维度最早出现的最强偏好。
 return {scores,key:scores.map((v,i)=>(v||strongest[i])>0?'1':'0').join('')};
}
let answers=[],at=0;
function page(id){
 for(const key of ['home','quiz','result'])$(key).hidden=key!==id;
 window.scrollTo(0,0);
}
function animate(el){el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim')}
function render(){
 const q=BOOK.questions[at],n=BOOK.questions.length,order=permutations[(at+Math.floor(at/4))%4];
 $('count').textContent=String(at+1).padStart(2,'0')+' / '+n;
 $('progress').max=n;$('progress').value=answers.filter(Number.isInteger).length;
 $('question').textContent=q[1];$('options').replaceChildren();
 const reviewing=Number.isInteger(answers[at]);
 order.forEach((choice,i)=>{
  const btn=document.createElement('button');btn.className='option';btn.type='button';
  const letter=document.createElement('span');letter.textContent='ABCD'[i];letter.setAttribute('aria-hidden','true');
  btn.append(letter,document.createTextNode(q[choice+2]));btn.setAttribute('aria-pressed',String(answers[at]===choice));
  btn.onclick=()=>{
   answers[at]=choice;
   if(!reviewing){advance();return}
   for(const item of $('options').children)item.setAttribute('aria-pressed',String(item===btn));
  };
  $('options').append(btn);
 });
 $('next').hidden=!reviewing;$('next').disabled=!reviewing;$('prev').disabled=at===0;
 $('next').textContent=at===n-1?'揭晓我的人物 →':'下一题 →';
 $('question').focus({preventScroll:true});window.scrollTo(0,0);animate($('options'));
}
function begin(){answers=[];at=0;page('quiz');render()}
$('start').onclick=begin;$('restart').onclick=begin;
$('prev').onclick=()=>{if(at>0){at--;render()}};
function advance(){
 if(!Number.isInteger(answers[at]))return;
 if(at<BOOK.questions.length-1){at++;render();return}
 const {key}=match(answers),profile=BOOK.profiles[key];
 ['name','role','quote','traits','why','gift','egg'].forEach((id,i)=>$(id).textContent=profile[i]);
 page('result');$('name').focus({preventScroll:true});animate($('result'));
 if(typeof portraitStudio!=='undefined')portraitStudio.show({name:profile[0],title:BOOK.title,quote:profile[2],spec:portraitSpecs[profile[0]],edition:editions[profile[0]],
  sections:()=>[['身份与性格',profile[1]+' · '+profile[3]],['匹配理由',profile[4]],['隐藏优势',profile[5]],['趣味彩蛋',profile[6]]]});
}
$('next').onclick=advance;

for(const plate of Object.values(editions)){
 const img=new Image();
 plate.image=img;
 plate.ready=new Promise(resolve=>{img.onload=()=>resolve(true);img.onerror=()=>resolve(false)});
 img.src=plate.src;
}
function showCredit(plate){
 const box=document.getElementById('plateCredit');
 function link(text,url){
  const a=document.createElement('a');a.href=url;a.textContent=text;a.target='_blank';a.rel='noopener noreferrer';return a;
 }
 box.replaceChildren('AI 正面改绘 · 参考 ',link(plate.title,plate.url),' · '+plate.by+' · 原作许可 · ');
 box.append(plate.terms?link(plate.license,plate.terms):plate.license);
}
function drawEdition(canvas,model){
 const g=canvas.getContext('2d'),p=model.edition,img=p.image;
 const scale=Math.min(548/img.naturalWidth,526/img.naturalHeight);
 const w=img.naturalWidth*scale,h=img.naturalHeight*scale,left=338-w/2,top=(600-h)/2;
 g.fillStyle='#f5efdf';g.fillRect(0,0,960,600);
 g.strokeStyle='#b6a786';g.lineWidth=1.5;g.strokeRect(17,17,926,566);
 g.drawImage(img,left,top,w,h);
 g.fillStyle='#aa9a7c';g.fillRect(653,55,1,490);
 g.textAlign='center';g.textBaseline='middle';g.fillStyle='#35392f';
 g.font='70px "Songti SC","SimSun",serif';
 Array.from(model.name).forEach((ch,i)=>g.fillText(ch,775,284+(i-(model.name.length-1)/2)*85));
 g.fillStyle='#913c2d';g.fillRect(734,477,82,36);g.fillStyle='#fff4de';
 g.font='22px "Songti SC","SimSun",serif';g.fillText('人物志',775,496);
}

const portraitStudio=(()=>{
 const by=id=>document.getElementById(id), art=by('characterArt');
 const message=by('portraitStatus'), overlay=by('exportOverlay'), preview=by('exportImage'), download=by('downloadCard');
 let model=null;
 function surface(w,h){const el=document.createElement('canvas');el.width=w;el.height=h;return el}
 function draw(){
  if(!model)return;
  if(model.edition)drawEdition(art,model);
  else paintCharacter(art,model.spec);
  art.setAttribute('aria-label',model.name+'，正面半身画像');
 }
 function closeExport(){overlay.hidden=true;preview.removeAttribute('src');download.removeAttribute('href');if(model)by('makeCard').focus({preventScroll:true})}
 function clear(){model=null;closeExport();message.textContent=''}
 function show(data){
  clear();model=data;
  const plate=data.edition;
  by('makeCard').disabled=false;
  if(plate){
   showCredit(plate);
   if(!plate.image.naturalWidth){
    art.getContext('2d').clearRect(0,0,art.width,art.height);by('makeCard').disabled=true;
    plate.ready.then(ok=>{if(model!==data)return;if(ok){draw();by('makeCard').disabled=false}else message.textContent='图版读取失败，请刷新重试。'});
    return;
   }
  }
  draw();
 }
 function wrap(ctx,text,width){
  const lines=[];let row='';
  for(const ch of Array.from(text)){if(ch==='\n'){lines.push(row);row='';continue}
   if(row&&ctx.measureText(row+ch).width>width){lines.push(row);row=ch}else row+=ch}
  if(row)lines.push(row);return lines;
 }
 function poster(){
  draw();const w=900,pad=56,inner=w-pad*2,scratch=surface(w,1),measure=scratch.getContext('2d'),runs=[];let y=54;
  const serif='"Songti SC","STSong","SimSun",serif',sans='"PingFang SC","Microsoft YaHei",sans-serif';
  const color='#'+model.spec[4],ink='#322f33',accent='#784c3e';
  function textBlock(str,size,lineH,font,col,bold=false){const fontValue=(bold?'bold ':'')+size+'px '+font;measure.font=fontValue;
   for(const line of wrap(measure,str,inner)){runs.push({type:'text',line,y,font:fontValue,col});y+=lineH}}
  textBlock('性情手册  /  '+model.title,24,35,sans,accent);y+=10;
  textBlock(model.name,54,70,serif,ink,true);y+=10;
  runs.push({type:'art',y});y+=Math.round(inner*art.height/art.width)+28;
  textBlock(model.quote,34,49,serif,accent,true);y+=12;
  for(const [label,content] of model.sections()){
   if(!content)continue;runs.push({type:'rule',y});y+=18;textBlock(label,28,42,serif,ink,true);textBlock(content,26,40,sans,ink);y+=19;
  }
  if(model.edition){
   const e=model.edition;
   textBlock(e.title+' · '+e.by,22,32,sans,accent);
   textBlock('AI 正面改绘 · 图源许可 ' + +e.license,20,29,sans,accent);
   textBlock(e.url,17,24,sans,accent);
   if(e.terms)textBlock(e.terms,17,24,sans,accent);
  }
  y+=4;textBlock('性情手册 · 趣味结果签',22,32,sans,accent);
  const card=surface(w,Math.ceil(y+30)),p=card.getContext('2d');
  p.fillStyle='#faf5e8';p.fillRect(0,0,w,card.height);p.fillStyle=color;p.fillRect(0,0,w,10);p.textBaseline='top';
  for(const r of runs){if(r.type==='art')p.drawImage(art,pad,r.y,inner,inner*art.height/art.width);
   else if(r.type==='rule'){p.fillStyle='#d2c8b7';p.fillRect(pad,r.y,inner,2)}
   else{p.fillStyle=r.col;p.font=r.font;p.fillText(r.line,pad,r.y)}}
  return card.toDataURL('image/png');
 }
 by('makeCard').onclick=()=>{
  if(!model||(model.edition&&!model.edition.image.naturalWidth))return;
  try{const uri=poster();preview.src=uri;preview.alt=model.name+'完整结果卡';download.href=uri;download.download='性情手册-'+model.name+'.png';
   overlay.hidden=false;by('closeExport').focus({preventScroll:true});}
  catch{message.textContent='长图生成失败，请重试或截屏保存。'}
 };
 by('closeExport').onclick=closeExport;
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeExport()});
 document.addEventListener('keydown',e=>{
  if(overlay.hidden)return;
  if(e.key==='Escape'){e.preventDefault();closeExport()}
  if(e.key==='Tab'){const first=by('closeExport'),last=download;
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
   else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
 });
 by('restart').addEventListener('click',clear);
 return {show};
})();
</script></body></html>
