const portraitStudio=(()=>{
 const by=id=>document.getElementById(id), art=by('characterArt');
 const file=by('faceFile'), editor=by('faceEditor'), message=by('portraitStatus'), overlay=by('exportOverlay');
 const preview=by('exportImage'), download=by('downloadCard');
 const sliders=['faceZoom','faceX','faceY'].map(by), [zoom,xPan,yPan]=sliders;
 let model=null, source=null, ticket=0, mode='original', frame=0, locked=false;
 function surface(w,h=w){const el=document.createElement('canvas');el.width=w;el.height=h;return el}
 function cropFace(){
  if(!source)return null;
  const side=Math.min(source.width,source.height)/Number(zoom.value);
  const x=(source.width-side)*(Number(xPan.value)+100)/200,y=(source.height-side)*(Number(yPan.value)+100)/200;
  const chip=surface(240),ctx=chip.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#f4dbc3';ctx.fillRect(0,0,240,240);
  ctx.drawImage(source,x,y,side,side,0,0,240,240);
  if(mode==='styled')inkFace(ctx,model.spec);
  return chip;
 }
 function inkFace(ctx,spec){
  const {width:w,height:h}=ctx.canvas, pixels=ctx.getImageData(0,0,w,h), dst=pixels.data,src=new Uint8ClampedArray(dst);
  const color=parseInt(spec[4],16),accent=[color>>16,(color>>8)&255,color&255];
  const historical=['汉服','长衫','帝服','甲衣'].includes(spec[0]),night=spec[3]==='夜色';
  const tones=historical?6:night?7:8,paper=historical?[255,237,207]:night?[230,226,244]:[255,239,225];
  const luminance=i=>.299*src[i]+.587*src[i+1]+.114*src[i+2];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const i=(y*w+x)*4,L=luminance(i);let total=2,r=src[i]*2,g=src[i+1]*2,b=src[i+2]*2;
   // Edge-preserving smoothing keeps the subject's facial landmarks readable.
   for(const [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2]]){
    const n=(Math.max(0,Math.min(h-1,y+dy))*w+Math.max(0,Math.min(w-1,x+dx)))*4;
    if(Math.abs(luminance(n)-L)<29){r+=src[n];g+=src[n+1];b+=src[n+2];total++}
   }
   r/=total;g/=total;b/=total;
   const light=.299*r+.587*g+.114*b, band=Math.round(light/255*(tones-1))/(tones-1), tint=band<.5?accent:paper;
   const right=i+(x<w-1?4:0),down=i+(y<h-1?w*4:0);
   const edge=Math.min(.60,Math.max(0,(Math.abs(luminance(right)-L)+Math.abs(luminance(down)-L)-24)/100));
   const tintAmount=historical?.30:.23;
   [r,g,b].forEach((v,k)=>{const block=band*255+(v-light)*.72;dst[i+k]=(block*(1-tintAmount)+tint[k]*tintAmount)*(1-edge)+[54,48,58][k]*edge});
  }
  ctx.putImageData(pixels,0,0);
 }
 function draw(){
  frame=0;if(!model)return;
  paintCharacter(art,model.spec,cropFace(),{zoom:1,x:0,y:0});
  art.setAttribute('aria-label',model.name+(source?'，使用自选头像':'，专属卡通画像'));
 }
 function schedule(){if(!frame)frame=requestAnimationFrame(draw)}
 function setMode(value){mode=value;for(const el of editor.querySelectorAll('[data-face-mode]'))el.setAttribute('aria-pressed',String(el.dataset.faceMode===value));schedule()}
 function resetCrop(){zoom.value='1';xPan.value='0';yPan.value='0'}
 function closeExport(){overlay.hidden=true;preview.removeAttribute('src');download.removeAttribute('href');if(model)by('makeCard').focus({preventScroll:true})}
 function clear(){
  ticket++;source=null;model=null;locked=false;file.value='';editor.hidden=true;message.textContent='';by('makeCard').disabled=false;overlay.hidden=true;preview.removeAttribute('src');download.removeAttribute('href');
  if(frame)cancelAnimationFrame(frame);frame=0;
 }
 function show(data){
  clear();model=data;resetCrop();mode='original';
  const ancient=['汉服','长衫','帝服','甲衣'].includes(data.spec[0]);
  by('styledFace').textContent=ancient?'彩墨画风':data.spec[3]==='夜色'?'夜色版画':'绘本画风';
  draw();
 }
 file.addEventListener('change',async()=>{
  const f=file.files[0];if(!f||!model)return;
  const seq=++ticket;locked=true;by('makeCard').disabled=true;message.textContent='正在读取头像…';
  const url=URL.createObjectURL(f);
  try{
   const img=new Image();
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
   if(seq!==ticket||!model)return;
   const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
   const resized=surface(Math.max(1,Math.round(img.naturalWidth*scale)),Math.max(1,Math.round(img.naturalHeight*scale)));
   resized.getContext('2d').drawImage(img,0,0,resized.width,resized.height);
   source=resized;resetCrop();editor.hidden=false;setMode('original');draw();
   message.textContent='头像已放入画中，可调整取景位置。';
  }catch{if(seq===ticket)message.textContent='这张图片未能读取，请选择相册中的 JPG、PNG 或 WebP 图片。'}
  finally{URL.revokeObjectURL(url);if(seq===ticket){file.value='';locked=false;by('makeCard').disabled=false}}
 });
 for(const el of editor.querySelectorAll('[data-face-mode]'))el.onclick=()=>setMode(el.dataset.faceMode);
 sliders.forEach(el=>el.oninput=schedule);
 by('resetPortrait').onclick=()=>{ticket++;source=null;file.value='';editor.hidden=true;locked=false;by('makeCard').disabled=false;message.textContent='已恢复角色画像。';draw()};
 by('chooseFace').onclick=()=>file.click();
 function wrap(ctx,text,width){
  const lines=[];let row='';
  for(const ch of Array.from(text)){if(ch==='\n'){lines.push(row);row='';continue}
   if(row&&ctx.measureText(row+ch).width>width){lines.push(row);row=ch}else row+=ch}
  if(row)lines.push(row);return lines;
 }
 function poster(){
  draw();const w=900,pad=56,inner=w-pad*2,scratch=surface(w,1),measure=scratch.getContext('2d'),runs=[];let y=54;
  const serif='"Songti SC","STSong","SimSun",serif',sans='"PingFang SC","Microsoft YaHei",sans-serif';
  const color='#'+model.spec[4],ink='#322f33',accent='#784c3e';
  function textBlock(str,size,lineH,font,col,bold=false){const fontValue=(bold?'bold ':'')+size+'px '+font;measure.font=fontValue;
   for(const line of wrap(measure,str,inner)){runs.push({type:'text',line,y,font:fontValue,col});y+=lineH}}
  textBlock('性情手册  /  '+model.title,24,35,sans,accent);y+=10;
  textBlock(model.name,54,70,serif,ink,true);y+=10;
  runs.push({type:'art',y});y+=Math.round(inner*art.height/art.width)+28;
  textBlock(model.quote,34,49,serif,accent,true);y+=12;
  for(const [label,content] of model.sections()){
   if(!content)continue;runs.push({type:'rule',y});y+=18;textBlock(label,28,42,serif,ink,true);textBlock(content,26,40,sans,ink);y+=19;
  }
  y+=4;textBlock('性情手册 · 趣味结果签',22,32,sans,accent);
  const card=surface(w,Math.ceil(y+30)),p=card.getContext('2d');
  p.fillStyle='#faf5e8';p.fillRect(0,0,w,card.height);p.fillStyle=color;p.fillRect(0,0,w,10);p.textBaseline='top';
  for(const r of runs){if(r.type==='art')p.drawImage(art,pad,r.y,inner,inner*art.height/art.width);
   else if(r.type==='rule'){p.fillStyle='#d2c8b7';p.fillRect(pad,r.y,inner,2)}
   else{p.fillStyle=r.col;p.font=r.font;p.fillText(r.line,pad,r.y)}}
  return card.toDataURL('image/png');
 }
 by('makeCard').onclick=()=>{
  if(!model||locked)return;
  try{const uri=poster();preview.src=uri;preview.alt=model.name+'完整结果卡';download.href=uri;download.download='性情手册-'+model.name+'.png';
   overlay.hidden=false;by('closeExport').focus({preventScroll:true});}
  catch{message.textContent='长图生成失败，请重试或截屏保存。'}
 };
 by('closeExport').onclick=closeExport;
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeExport()});
 document.addEventListener('keydown',e=>{
  if(overlay.hidden)return;
  if(e.key==='Escape'){e.preventDefault();closeExport()}
  if(e.key==='Tab'){const first=by('closeExport'),last=download;
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
   else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
 });
 by('restart').addEventListener('click',clear);
 return {show};
})();
</script></body></html>
