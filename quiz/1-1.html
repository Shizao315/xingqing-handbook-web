function motion(el){el.classList.remove('anim');void el.offsetWidth;el.classList.add('anim')}
function start(){pos=0;answers=[];first=null;page('quiz');render()}
function render(){
 const current=Q[pos];$('phase').textContent=isPair?(first?'第二位答题者':'第一位答题者'):'作答中';
 $('counter').textContent=String(pos+1).padStart(2,'0')+' / '+Q.length;
 $('progress').max=Q.length;$('progress').value=answers.filter(Number.isInteger).length;
 $('prompt').textContent=current.text;$('choices').replaceChildren();
 current.options.forEach(({label},i)=>{const btn=document.createElement('button'),letter=document.createElement('span');btn.className='choice';letter.textContent='ABCD'[i];letter.setAttribute('aria-hidden','true');btn.append(letter,document.createTextNode(label));btn.setAttribute('aria-pressed',String(answers[pos]===i));btn.onclick=()=>{answers[pos]=i;for(const el of $('choices').children)el.setAttribute('aria-pressed',String(el===btn));$('next').disabled=false;$('progress').value=answers.filter(Number.isInteger).length};$('choices').append(btn)});
 $('back').disabled=pos===0;$('next').disabled=!Number.isInteger(answers[pos]);$('next').textContent=pos<39?'下一题 →':isPair&&!first?'完成并交接 →':'揭晓结果 →';
 $('prompt').focus({preventScroll:true});window.scrollTo(0,0);motion($('choices'));
}
function detail(title,body){const box=document.createElement('section'),h=document.createElement('h4'),p=document.createElement('p');box.className='detail';h.textContent=title;p.textContent=body;box.append(h,p);$('details').append(box);return box}
const pairTalk={
 '联系频率':'忙起来时，什么时候发一条消息最舒服？',
 '提前安排':'周末要提前定下哪件事，哪件事可以当天再说？',
 '共同活动':'下周想一起做哪件事，又想各自留出哪段时间？',
 '即时沟通':'有分歧时，怎样说暂停、约在何时继续谈？'
};
function tendency(v){return v>=.55?'偏高':v<=-.55?'偏低':'居中'}
function result(){
 const current=score(answers);$('details').replaceChildren();let p;
 if(isPair){
  const {index,dif,mean}=comparison(first,current);p=TEST.profiles[index];const sorted=[...dif].sort((a,b)=>a.gap-b.gap),near=sorted[0],far=sorted[sorted.length-1];
  detail('相处特点',p[1]+'。'+(mean===0?'四项偏好的得分都相同。':'四项偏好中，「'+near.axis+'」是你们差距最小的一项。'));
  detail('匹配理由',mean===0?'你们分别作答后，每项偏好的平均分都一致；具体选项仍可能不同。':'对照两人的独立答案，差距最大的一项是「'+far.axis+'」。第一位的偏好'+tendency(far.a)+'，第二位'+tendency(far.b)+'。');
  const box=detail('双人偏好对照','偏高表示更看重该项习惯；偏低表示更偏好相反的安排。');
  for(const item of dif){const row=document.createElement('div');row.className='pairrow';for(const str of [item.axis,'甲 · '+tendency(item.a),'乙 · '+tendency(item.b)]){let e=document.createElement('span');e.textContent=str;row.append(e)}box.append(row)}
  detail('一起聊聊',pairTalk[far.axis]);
 }else{
  const ranks=ranking(current),lead=ranks[0],next=ranks[1];p=TEST.profiles.find(p=>p[1]===lead.axis);
  const tied=ranks.filter(s=>s.value===lead.value).map(s=>'「'+s.axis+'」');
  let summary='你选择的做法里，「'+lead.axis+'」得分最高。';
  if(tied.length>1)summary=tied.join('、')+'并列最高，这张签呈现其中一种读法。';
  if(TEST.mode==='分维度' && lead.value<=0)summary+='你在这些情境里很少选择强化该倾向的做法，这一结果只反映相对排序。';
  detail('性格特点',summary);
  const i=lead.evidence, selected=Q[i].options[answers[i]];
  const count=Q.filter((q,j)=>(q.options[answers[j]].points[lead.axis]??0)>0).length;
  let explanation=TEST.mode==='分型'?'40 个场景中，你有 '+count+' 次选了与「'+lead.axis+'」对应的行动。':'结果综合了各道情境题中选择的方向和强度。';
  detail('匹配理由','面对「'+Q[i].text+'」，你选了「'+selected.label+'」。'+explanation);
 }
 $('resName').textContent=p[0];$('quote').textContent=p[2];detail('隐藏优势',p[3]);detail('趣味彩蛋',p[4]);
 page('result');$('resName').focus({preventScroll:true});motion($('result'));
}
$('start').onclick=start;$('restart').onclick=start;$('back').onclick=()=>{if(pos){pos--;render()}};
$('next').onclick=()=>{if(!Number.isInteger(answers[pos]))return;if(pos<Q.length-1){pos++;render()}else if(isPair&&!first){first=score(answers);answers=[];pos=0;page('handoff');$('take').focus()}else result()};
$('take').onclick=()=>{page('quiz');render()};
</script><script>function drawPlate(cv){
 const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
 const d=Math.min(devicePixelRatio||1,2);cv.width=w*d;cv.height=h*d;
 const c=cv.getContext('2d'),k=Number(cv.dataset.plate),pal=[['#36575a','#94aaa0','#cc916b'],['#475e50','#a1ad8c','#bd7251'],['#8f4645','#ce9a8a','#d5ac71'],['#38566c','#8fa9b6','#c59a63'],['#556444','#a3ae7b','#cc9360']][k];
 c.scale(d,d);const scale=Math.min(w/360,h/205);c.translate(w/2,h/2);c.scale(scale,scale);
 const [ink,mid,ochre]=pal;
 function path(points,fill){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill()}

 const paper='#f2ead8';disk(0,-4,85,'#e3dac2');disk(55,-53,17,ochre);
 if(k===0){
  for(let i=0;i<11;i++){const x=-139+i*25,y=16-Math.abs(Math.sin(i*3.86))*61;c.fillStyle=i%3?mid:ink;c.fillRect(x,y,22,60-y);path([[x-4,y],[x+11,y-11],[x+25,y]],ink);for(let j=y+7;j<52;j+=10)for(let a=4;a<18;a+=7){c.fillStyle=paper;c.fillRect(x+a,j,3,4)}}
  path([[-157,52],[155,52],[125,65],[-136,65]],ink);for(let i=0;i<8;i++)line(-110+i*25,72+i%3*4,-65+i*25,72+i%3*4,mid);
 }else if(k===1){
  for(let i=0;i<3;i++){const pts=[[-155,70]];for(let x=-155;x<=155;x+=5)pts.push([x,20+15*i+20*Math.sin(x/33+i)+14*Math.cos(x/15+2*i)-35*Math.exp(-((x-20*i)**2)/1500)]);pts.push([155,67]);path(pts,[mid,'#788b73',ink][i])}
 }else if(k===2){
  for(const [x,y,r] of [[-47,10,-.18],[45,1,.17]]){c.save();c.translate(x,y);c.rotate(r);c.fillStyle=ink;c.fillRect(-63,-38,126,80);path([[-60,-35],[59,-35],[0,9]],paper);path([[-59,38],[0,-1],[59,38]],mid);disk(0,5,8,ochre);c.restore()}
 }else if(k===3){
  for(let j=0;j<3;j++){c.save();c.rotate(j*.55-.45);c.strokeStyle=ink;c.lineWidth=1.8;c.beginPath();c.ellipse(0,0,126,35,0,0,Math.PI*2);c.stroke();disk(125,0,6,j?mid:ochre);c.restore()}
  path([[0,-41],[32,0],[0,45],[-32,0]],ink);path([[0,-41],[32,0],[0,4]],mid);line(0,4,0,45,paper);
 }else{
  for(let j=0;j<8;j++){const x=-112+j*29,y=-27-25*Math.sin(j*2);line(x+12,70,x,y,ink,1.4);ellipse(x+15,30,19,6,-.55,mid);ellipse(x-3,15,15,5,.62,ink);for(let a=0;a<5;a++){let t=a*1.256;ellipse(x+Math.cos(t)*6,y+Math.sin(t)*6,7,4,t,j%2?ochre:mid)}disk(x,y,3,ink)}
 }
 let seed=73;for(let i=0;i<2300;i++){seed=(seed*16807)%2147483647;const x=(seed%325)-162;seed=(seed*16807)%2147483647;const y=(seed%175)-87;c.fillStyle='rgba(249,243,221,.24)';c.fillRect(x,y,1,1)}
}
document.querySelectorAll('canvas[data-plate]').forEach(cv=>new ResizeObserver(()=>drawPlate(cv)).observe(cv));
